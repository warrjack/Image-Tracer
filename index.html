<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera With Advanced Image Overlay</title>

  <style>
    body, html {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none; /* Prevent browser scrolling/zoom while editing overlay */
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    .flipped {
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      border: 2px dashed #fff;
      top: 50px;
      left: 50px;
      display: none;
      touch-action: none;
    }

    #overlayImg {
      width: 200px;
      height: auto;
      display: block;
      pointer-events: none;
      transform-origin: center center;
    }

    .resize-handle {
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      bottom: -9px;
      right: -9px;
      cursor: se-resize;
      z-index: 10;
    }

    #controls {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 15px;
      border-radius: 12px;
      color: #fff;
      display: flex;
      gap: 15px;
      align-items: center;
      z-index: 9999;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="container">
    <video id="camera" autoplay playsinline></video>

    <div id="overlay">
      <img id="overlayImg">
      <div class="resize-handle"></div>
    </div>
  </div>

  <div id="controls">
    <label style="cursor:pointer">
      Upload Image
      <input type="file" id="imageUpload" accept="image/*" style="display:none">
    </label>

    <label>
      Opacity
      <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
    </label>

    <label>
      <input type="checkbox" id="lockRatio" checked>
      Lock Ratio
    </label>

    <label>
      <input type="checkbox" id="flipCamera">
      Flip Camera
    </label>

    <label>
      <input type="checkbox" id="flipOverlay">
      Flip Overlay
    </label>
  </div>

  <script>
    /************************************
     CAMERA START
    *************************************/
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        document.getElementById("camera").srcObject = stream;
      } catch (e) {
        alert("Camera access blocked");
      }
    }
    startCamera();

    /************************************
     ELEMENTS
    *************************************/
    const camera = document.getElementById("camera");
    const overlay = document.getElementById("overlay");
    const overlayImg = document.getElementById("overlayImg");
    const resizeHandle = document.querySelector(".resize-handle");
    const imageUpload = document.getElementById("imageUpload");
    const opacitySlider = document.getElementById("opacitySlider");
    const lockRatio = document.getElementById("lockRatio");
    const flipCamera = document.getElementById("flipCamera");
    const flipOverlay = document.getElementById("flipOverlay");

    /************************************
     STATE
    *************************************/
    let isDragging = false;
    let isResizing = false;

    let startX, startY;
    let offsetX, offsetY;

    let startWidth, startHeight;
    let aspect = 1;

    /* Gesture state */
    let gestureActive = false;
    let initialDistance = 0;
    let initialAngle = 0;
    let initialScale = 1;
    let currentScale = 1;
    let initialRotation = 0;
    let currentRotation = 0;

    /************************************
     UPLOAD IMAGE
    *************************************/
    imageUpload.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = evt => {
        overlayImg.src = evt.target.result;
        overlay.style.display = "block";
        overlayImg.onload = () => {
          aspect = overlayImg.naturalWidth / overlayImg.naturalHeight;
          overlayImg.style.width = "200px";
          overlayImg.style.height = "auto";
          currentScale = 1;
          currentRotation = 0;
          updateTransform();
        };
      };
      reader.readAsDataURL(file);
    });

    /************************************
     DESKTOP DRAG
    *************************************/
    overlay.addEventListener("mousedown", e => {
      if (e.target === resizeHandle) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      offsetX = overlay.offsetLeft;
      offsetY = overlay.offsetTop;
    });

    /************************************
     DESKTOP RESIZE
    *************************************/
    resizeHandle.addEventListener("mousedown", e => {
      e.stopPropagation();
      isResizing = true;
      startX = e.clientX;
      startY = e.clientY;
      startWidth = overlayImg.offsetWidth;
      startHeight = overlayImg.offsetHeight;
    });

    /************************************
     MOBILE TOUCH DRAG
    *************************************/
    overlay.addEventListener("touchstart", e => {
      if (e.touches.length === 1 && !gestureActive) {
        const t = e.touches[0];
        isDragging = true;
        startX = t.clientX;
        startY = t.clientY;
        offsetX = overlay.offsetLeft;
        offsetY = overlay.offsetTop;
      }
    });

    overlay.addEventListener("touchmove", e => {
      if (isDragging && e.touches.length === 1 && !gestureActive) {
        const t = e.touches[0];
        overlay.style.left = `${offsetX + (t.clientX - startX)}px`;
        overlay.style.top = `${offsetY + (t.clientY - startY)}px`;
        keepOverlayInsideBounds();
      }
    });

    /************************************
     MOBILE TOUCH RESIZE (handle)
    *************************************/
    resizeHandle.addEventListener("touchstart", e => {
      const t = e.touches[0];
      isResizing = true;
      startX = t.clientX;
      startY = t.clientY;
      startWidth = overlayImg.offsetWidth;
      startHeight = overlayImg.offsetHeight;
      e.stopPropagation();
    });

    resizeHandle.addEventListener("touchmove", e => {
      if (!isResizing) return;
      const t = e.touches[0];

      let newWidth = startWidth + (t.clientX - startX);
      let newHeight = lockRatio.checked ? newWidth / aspect : startHeight + (t.clientY - startY);

      overlayImg.style.width = `${newWidth}px`;
      overlayImg.style.height = `${newHeight}px`;

      keepOverlayInsideBounds();
    });

    /************************************
     MULTI-TOUCH PINCH + ROTATE
    *************************************/
    overlay.addEventListener("touchstart", e => {
      if (e.touches.length === 2) {
        gestureActive = true;

        const [t1, t2] = e.touches;
        initialDistance = getDistance(t1, t2);
        initialAngle = getAngle(t1, t2);

        initialScale = currentScale;
        initialRotation = currentRotation;
      }
    });

    overlay.addEventListener("touchmove", e => {
      if (e.touches.length === 2) {
        const [t1, t2] = e.touches;

        const newDist = getDistance(t1, t2);
        const newAngle = getAngle(t1, t2);

        currentScale = initialScale * (newDist / initialDistance);
        currentRotation = initialRotation + (newAngle - initialAngle);

        updateTransform();
      }
    });

    /************************************
     STOP INTERACTIONS
    *************************************/
    document.addEventListener("mouseup", () => {
      isDragging = false;
      isResizing = false;
    });

    document.addEventListener("touchend", () => {
      if (event.touches.length < 2) gestureActive = false;
      isDragging = false;
      isResizing = false;
    });

    /************************************
     TRANSFORM UPDATE
    *************************************/
    function updateTransform() {
      let flip = flipOverlay.checked ? -1 : 1;

      overlayImg.style.transform =
        `scale(${currentScale * flip}, ${currentScale}) rotate(${currentRotation}deg)`;

      keepOverlayInsideBounds();
    }

    /************************************
     ENSURE OVERLAY STAYS INSIDE CAMERA
    *************************************/
    function keepOverlayInsideBounds() {
      const cont = document.getElementById("container").getBoundingClientRect();
      const box = overlay.getBoundingClientRect();

      if (box.left < cont.left) overlay.style.left = "0px";
      if (box.top < cont.top) overlay.style.top = "0px";
      if (box.right > cont.right)
        overlay.style.left = `${cont.width - box.width}px`;
      if (box.bottom > cont.bottom)
        overlay.style.top = `${cont.height - box.height}px`;
    }

    /************************************
     HELPER FUNCTIONS
    *************************************/
    function getDistance(t1, t2) {
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function getAngle(t1, t2) {
      return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI;
    }

    /************************************
     OPACITY + CAMERA FLIP
    *************************************/
    opacitySlider.addEventListener("input", () => {
      overlay.style.opacity = opacitySlider.value;
    });

    flipCamera.addEventListener("change", () => {
      camera.classList.toggle("flipped", flipCamera.checked);
    });

    flipOverlay.addEventListener("change", () => {
      updateTransform();
    });

  </script>
</body>
</html>
